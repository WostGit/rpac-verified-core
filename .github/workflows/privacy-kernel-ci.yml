name: Privacy Kernel Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-privacy-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-heal checkout if corruption detected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts
          echo "[self-heal] validating repository integrity"

          CORRUPT=0
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 || CORRUPT=1
          git cat-file -e HEAD^{commit} >/dev/null 2>&1 || CORRUPT=1
          git fsck --full --no-reflogs >/tmp/git-fsck.log 2>&1 || CORRUPT=1

          if [ ! -d .git ] || [ ! -f .git/HEAD ] || [ ! -f .git/index ]; then
            CORRUPT=1
          fi

          if [ "$CORRUPT" -eq 1 ]; then
            echo "[self-heal] corruption or partial checkout detected; re-cloning"
            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            REF_NAME="${GITHUB_SHA}"
            TMP_RECLONE="$(mktemp -d)"
            git clone --no-tags --depth 1 "$REPO_URL" "$TMP_RECLONE/repo"
            (
              cd "$TMP_RECLONE/repo"
              git fetch --depth 1 origin "$REF_NAME"
              git checkout --force "$REF_NAME"
            )

            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            shopt -s dotglob
            cp -a "$TMP_RECLONE/repo"/* .
            shopt -u dotglob
            rm -rf "$TMP_RECLONE"

            echo "[self-heal] repair complete"
          else
            echo "[self-heal] checkout health OK"
          fi

          cp /tmp/git-fsck.log ci_artifacts/git-fsck.log || true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build and heal virtual environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts

          repair_venv() {
            echo "[venv] creating clean environment"
            rm -rf .venv
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip wheel setuptools
          }

          install_deps() {
            if [ -f requirements.txt ]; then
              python -m pip install -r requirements.txt
            elif [ -f pyproject.toml ]; then
              python -m pip install .
            else
              python -m pip install pytest
            fi
          }

          repair_venv
          if ! install_deps; then
            echo "[venv] dependency installation failed; repairing and retrying"
            repair_venv
            install_deps
          fi

          python - <<'PY'
import importlib
import pathlib
import subprocess
import sys

sentinels = [
    "pytest",
]

manifest = pathlib.Path("requirements.txt")
if manifest.exists():
    for line in manifest.read_text().splitlines():
        line = line.strip()
        if not line or line.startswith("#"):
            continue
        pkg = line.split("==")[0].split("[")[0].strip()
        if pkg and pkg.replace("-", "_").isidentifier():
            sentinels.append(pkg.replace("-", "_"))

broken = []
for module in dict.fromkeys(sentinels):
    try:
        importlib.import_module(module)
    except Exception as exc:  # noqa: BLE001
        broken.append(f"{module}: {exc}")

if broken:
    print("[venv] import check failed; forcing environment rebuild")
    print("\n".join(broken))
    raise SystemExit(2)
print("[venv] import validation passed")
PY

          IMPORT_RC=$?
          if [ "$IMPORT_RC" -ne 0 ]; then
            repair_venv
            install_deps
            source .venv/bin/activate
            python -m pip check
          fi

          source .venv/bin/activate
          python -m pip check | tee ci_artifacts/pip-check.log

      - name: Execute deterministic test harness with nondeterminism detection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/test-runs
          source .venv/bin/activate

          export ENFORCEMENT_LOG_PATH="$PWD/ci_artifacts/enforcement.log"
          export BOUND_OUTPUT_PATH="$PWD/ci_artifacts/bounds.json"
          export INVARIANT_REPORT_PATH="$PWD/ci_artifacts/invariants.json"

          TEST_CMD=(python -m pytest -q -ra \
            tests/test_pac_bound.py \
            tests/test_leakage_tracking.py \
            tests/test_enforcement_logic.py \
            tests/test_privacy_controller_invariants.py)

          success=0
          previous_hash=""
          nondeterministic=0
          declare -a hashes=()
          declare -a statuses=()

          for attempt in $(seq 1 10); do
            echo "[tests] attempt ${attempt}/10"
            set +e
            "${TEST_CMD[@]}" 2>&1 | tee "ci_artifacts/test-runs/run-${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e

            hash=$(sha256sum "ci_artifacts/test-runs/run-${attempt}.log" | awk '{print $1}')
            hashes+=("$hash")
            statuses+=("$status")

            if [ -n "$previous_hash" ] && [ "$previous_hash" != "$hash" ]; then
              nondeterministic=1
            fi
            previous_hash="$hash"

            if [ "$status" -eq 0 ]; then
              success=1
              break
            fi
          done

          {
            echo "nondeterministic=$nondeterministic"
            echo "hashes=${hashes[*]}"
            echo "statuses=${statuses[*]}"
          } | tee ci_artifacts/nondeterminism-summary.txt

          if [ "$nondeterministic" -eq 1 ]; then
            echo "[tests] nondeterminism detected across retries"
            echo "[tests] diagnostic summary"
            cat ci_artifacts/nondeterminism-summary.txt
          fi

          test -f "$ENFORCEMENT_LOG_PATH" || echo "{}" > "$ENFORCEMENT_LOG_PATH"
          test -f "$BOUND_OUTPUT_PATH" || echo "{}" > "$BOUND_OUTPUT_PATH"
          test -f "$INVARIANT_REPORT_PATH" || echo "{}" > "$INVARIANT_REPORT_PATH"

          if ! grep -Eiq '(invariant|bound|enforce|deny|noise|clip)' ci_artifacts/test-runs/run-*.log; then
            echo "[failure] expected privacy kernel checks were not observed in test output" >&2
            exit 96
          fi

          if grep -Eiq 'invariant( violation| failed)|bound( divergence| diverged)|enforcement( not activated| failed to activate)' ci_artifacts/test-runs/run-*.log; then
            echo "[failure] loud failure condition detected in logs" >&2
            exit 97
          fi

          if [ "$success" -ne 1 ]; then
            echo "[failure] tests failed after maximum retries" >&2
            exit 98
          fi

      - name: Upload privacy verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-kernel-artifacts
          path: |
            ci_artifacts/enforcement.log
            ci_artifacts/bounds.json
            ci_artifacts/invariants.json
            ci_artifacts/nondeterminism-summary.txt
            ci_artifacts/test-runs/*.log
            ci_artifacts/git-fsck.log
            ci_artifacts/pip-check.log
          if-no-files-found: warn
